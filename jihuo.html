<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>屏幕数值监控报警 - 激活码计算器</title>
<style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#121218;color:#eee;padding:24px}.box{max-width:620px;margin:auto;background:#1a1a26;padding:22px;border-radius:12px}.row{margin:12px 0}label{display:block;margin-bottom:6px;color:#aaa}input,button{width:100%;box-sizing:border-box;padding:10px;border-radius:6px;border:1px solid #444;background:#0d0d14;color:#00ff8c}button{background:#0088cc;color:#fff;border:0;font-weight:bold;cursor:pointer}.code{margin-top:14px;padding:12px;background:#0b0b10;border-radius:6px;word-break:break-all;color:#00ff8c;font-weight:bold}.hint{color:#aaa;font-size:13px;line-height:1.6}</style></head>
<body><div class="box"><h2>🔐 激活码计算器</h2><p class="hint">把软件首次启动显示的“设备识别码”粘贴进来，设置有效期后生成激活码。此页面用于软件管理员离线生成激活码。</p>
<div class="row"><label>设备识别码</label><input id="device" placeholder="例如 SA-12345678-ABCDEF12-34567890"></div>
<div class="row"><label>激活有效期（天）</label><input id="days" type="number" min="1" value="30"></div>
<div class="row"><label>签名密钥（必须与 main.py 的 LICENSE_SECRET 一致）</label><input id="secret" type="password" value="ScreenAlarm-License-2026-Change-This-Secret"></div>
<button onclick="generate()">生成激活码</button><div id="out" class="code">等待生成...</div>
<p class="hint">安全提示：不要把签名密钥发布给普通用户。建议只在管理员电脑离线使用此页面。</p></div>
<script>
function b64url(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function hmac(secret,msg){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);const sig=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(msg));return Array.from(new Uint8Array(sig)).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();}
async function generate(){const device=document.getElementById('device').value.trim();const days=Math.max(1,parseInt(document.getElementById('days').value||'30'));const secret=document.getElementById('secret').value;if(!device||!secret){alert('请填写设备识别码和签名密钥');return;}const exp=Math.floor(Date.now()/1000)+days*86400;const payload=device+'|'+exp;const sig=(await hmac(secret,payload)).slice(0,20);const code='SA1-'+b64url(payload)+'-'+sig;document.getElementById('out').textContent=code;try{await navigator.clipboard.writeText(code);}catch(e){}}
</script></body></html>
