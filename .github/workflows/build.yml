name: Windows EXE 手动打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "网页刷新数字监控" --icon=1.ico main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 网页刷新数字监控-Windows
          path: dist/网页刷新数字监控.exe
