name: Windows 在线打包

on:
  workflow_dispatch:
  push:
    paths:
      - "bgclick_test/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bgclick_test/requirements.txt

      - name: 升级打包工具
        working-directory: bgclick_test
        run: python -m pip install --upgrade pip setuptools wheel

      - name: 安装依赖
        working-directory: bgclick_test
        run: python -m pip install -r requirements.txt

      - name: 检查 Python 语法
        working-directory: bgclick_test
        run: python -m py_compile main.py

      - name: PyInstaller 打包
        working-directory: bgclick_test
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name="后台鼠标点击测试工具" main.py

      - name: 打包 ZIP
        shell: powershell
        run: |
          if (Test-Path "bgclick_test\dist\后台鼠标点击测试工具") {
            Compress-Archive -Path "bgclick_test\dist\后台鼠标点击测试工具\*" -DestinationPath "后台鼠标点击测试工具-Windows.zip" -Force
          } else {
            Write-Error "PyInstaller 输出目录不存在"
          }

      - name: 上传 EXE 文件夹
        uses: actions/upload-artifact@v4
        with:
          name: backend-mouse-click-test-windows
          path: bgclick_test/dist/后台鼠标点击测试工具
          if-no-files-found: error

      - name: 上传 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: backend-mouse-click-test-zip
          path: 后台鼠标点击测试工具-Windows.zip
          if-no-files-found: error
