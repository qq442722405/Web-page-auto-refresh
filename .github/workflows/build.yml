name: Windows Online Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check source
        shell: powershell
        run: |
          python -m py_compile main.py
          Write-Host "Source check OK"

      - name: Build Windows EXE
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name BackendMouseClickTest main.py

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\BackendMouseClickTest\BackendMouseClickTest.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Error "EXE not found"
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "dist") -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "EXE found: $exe"

      - name: Create ZIP
        shell: powershell
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "dist\BackendMouseClickTest"
          $zip = Join-Path $env:GITHUB_WORKSPACE "后台鼠标点击测试工具-Windows.zip"
          Compress-Archive -Path (Join-Path $dir "*") -DestinationPath $zip -Force
          Write-Host "ZIP created: $zip"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BackendMouseClickTest-Windows
          path: dist/BackendMouseClickTest
          if-no-files-found: error

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 后台鼠标点击测试工具-Windows-ZIP
          path: 后台鼠标点击测试工具-Windows.zip
          if-no-files-found: error
