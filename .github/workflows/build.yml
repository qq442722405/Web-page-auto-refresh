name: 网页刷新数字监控

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 ddddocr opencv-python numpy pyinstaller

    - name: 使用 PyInstaller 打包应用
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-data ddddocr --add-data "1.ico;." --icon="1.ico" --name "网页刷新数字监控" main.py

    - name: 上传构建产物 EXE
      uses: actions/upload-artifact@v4
      with:
        name: 网页刷新数字监控-Windows-EXE
        path: dist/网页刷新数字监控/
