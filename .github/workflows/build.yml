name: Windows Online Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check source
        shell: powershell
        run: |
          python -m py_compile main.py

      - name: Build EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name BackendMouseClickTest main.py

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\BackendMouseClickTest\BackendMouseClickTest.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Error "EXE not found"
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "dist") -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "EXE build OK"

      - name: Create ZIP
        shell: powershell
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "dist\BackendMouseClickTest"
          $zip = Join-Path $env:GITHUB_WORKSPACE "BackendMouseClickTest-Windows.zip"
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $dir "*") -DestinationPath $zip -Force
          if (-not (Test-Path -LiteralPath $zip)) {
            Write-Error "ZIP creation failed"
            exit 1
          }
          Write-Host "ZIP created: $zip"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BackendMouseClickTest-Windows
          path: dist/BackendMouseClickTest
          if-no-files-found: error

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BackendMouseClickTest-Windows-ZIP
          path: BackendMouseClickTest-Windows.zip
          if-no-files-found: error
