name: Windows EXE 手动打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Verify imports and OCR model
        shell: cmd
        run: |
          python -c "import PySide6; from PySide6.QtWebEngineWidgets import QWebEngineView; import ddddocr, onnxruntime; print('PySide6 OK'); print('QWebEngine/Chromium OK'); print('ddddocr OK'); print('onnxruntime OK')"
          python -c "import ddddocr; o=ddddocr.DdddOcr(show_ad=False); print('ddddocr model initialization: OK')"

      - name: Check Python syntax
        shell: cmd
        run: |
          python -m py_compile main.py

      - name: Build onedir EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "网页刷新数字监控" --icon=1.ico ^
            --collect-all ddddocr ^
            --collect-all onnxruntime ^
            --hidden-import=PySide6.QtWebEngineCore ^
            --hidden-import=PySide6.QtWebEngineWidgets ^
            --hidden-import=onnxruntime.capi.onnxruntime_pybind11_state ^
            --hidden-import=ddddocr ^
            main.py

      - name: Verify packaged EXE exists
        shell: cmd
        run: |
          if not exist "dist\网页刷新数字监控\网页刷新数字监控.exe" exit /b 1
          dir "dist\网页刷新数字监控\网页刷新数字监控.exe"

      - name: Copy runtime files
        shell: cmd
        run: |
          copy /Y "日志.TXT" "dist\网页刷新数字监控\日志.TXT"
          copy /Y "1.ico" "dist\网页刷新数字监控\1.ico"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 网页刷新数字监控-Windows-目录版
          path: dist/网页刷新数字监控
