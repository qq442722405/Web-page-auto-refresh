name: GitHub 在线打包 Windows EXE

# 触发条件：推送到 main 目录，或者在 GitHub 页面手动点击运行
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 配置 Python 环境 (推荐 3.10，对 ddddocr 和 ONNX 支持最稳定)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装依赖库
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 ddddocr opencv-python numpy pyinstaller

    # 4. 执行 PyInstaller 打包指令
    - name: Run PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="WebMonitorOCR" --collect-all ddddocr --collect-all PySide6 main.py

    # 5. 上传打包产物 (自动压缩为 ZIP 供下载)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebMonitorOCR_Windows_x64
        path: dist/WebMonitorOCR
